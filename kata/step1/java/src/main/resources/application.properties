spring.application.name=kata-agentic-java-step1

# Render errors as RFC 9457 problem details, so a reason handed to ResponseStatusException or
# ProblemDetail reaches the caller. Without it Boot answers with a timestamp, a status and a path,
# and the sentence you wrote is nowhere in the body: `server.error.include-message=always` is the
# property people reach for and it no longer changes that on Boot 4. This is a service people learn
# against, so a refusal that throws your own message away is the wrong default here.
spring.mvc.problemdetails.enabled=true
